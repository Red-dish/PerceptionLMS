[project]
name = "perception-lms-api"
version = "0.1.0"
description = "Perception LMS API: FastAPI on AWS Lambda with Google sign-in and DynamoDB"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.120",
    "mangum>=0.19",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "moto[dynamodb,s3]>=5.1",
    "pytest>=8.4",
    "uvicorn>=0.38",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
