<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6759d8" />
  <title>StudentHub Marks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="marks.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html" aria-label="StudentHub home"><span class="brand-mark">S</span><span>StudentHub</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-item" href="index.html"><span class="nav-icon">⌂</span><span>Dashboard</span></a>
      <button class="nav-item" data-page="courses"><span class="nav-icon">▦</span><span>My Courses</span></button>
      <button class="nav-item" data-page="assignments"><span class="nav-icon">✓</span><span>Assignments</span></button>
      <a class="nav-item active" href="marks.html" aria-current="page"><span class="nav-icon">%</span><span>Marks</span></a>
      <button class="nav-item" data-page="calendar"><span class="nav-icon">▣</span><span>Calendar</span></button>
      <button class="nav-item" data-page="messages"><span class="nav-icon">◌</span><span>Messages</span></button>
      <button class="nav-item" data-page="resources"><span class="nav-icon">▱</span><span>Resources</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      <button class="nav-item"><span class="nav-icon">↪</span><span>Log out</span></button>
    </div>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <button class="icon-button menu-button" id="menuButton" aria-label="Open menu">☰</button>
      <div class="search-wrap">
        <span>⌕</span>
        <input id="globalSearch" type="search" placeholder="Search students or courses..." aria-label="Search" />
      </div>
      <div class="top-actions">
        <button class="profile-button" aria-label="Current user">
          <span class="avatar" id="profileAvatar"></span>
          <span class="profile-copy"><strong id="profileName"></strong><small id="profileRole"></small></span>
        </button>
      </div>
    </header>

    <div class="page-content">
      <section class="welcome-row">
        <div>
          <p class="eyebrow" id="todayLabel"></p>
          <h1 id="marksTitle">Marks</h1>
          <p id="marksSubtitle"></p>
        </div>
      </section>

      <div class="demo-bar">
        <p><strong>Prototype:</strong> choose a demo user instead of logging in. Marks are saved in this browser only and are not yet protected by a server (SEC-02).</p>
        <label>Viewing as <select class="field-select" id="demoUser"></select></label>
        <button type="button" class="secondary-button" id="resetDemo">Reset demo data</button>
      </div>

      <div id="marksView"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="grades.js"></script>
  <script src="marks.js"></script>
</body>
</html>
